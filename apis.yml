aid: betterup
name: BetterUp
description: 'BetterUp is an enterprise Human Transformation Platform that combines human and AI-powered
  coaching, grounded in behavioral science and enterprise data, to help organizations develop leaders,
  managers, and their broader workforce. Founded by Alexi Robichaux, BetterUp serves 750+ enterprise
  customers including Google, Salesforce, Moderna, and Workday, with a network of 4,000+ coaches across
  70+ countries. The platform delivers leadership development, manager effectiveness, AI coaching, and
  workforce resilience programs. BetterUp is HR-tech / organizational-development software and exposes
  no public developer API; platform integration is delivered through packaged enterprise connectors
  (Workday, Salesforce, Slack, Microsoft Viva, SAP SuccessFactors, Degreed) plus HRIS and SSO
  provisioning. Sector: hr-tech.'
